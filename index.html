<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Executivo Cloud SaaS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#22c55e' } } } }
    }
  </script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }

    /* DARK MODE */
    .dark body { background-color: #0b0f19; color: #f3f4f6; }
    .dark .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .dark .glass-input { background: rgba(31, 41, 55, 0.6); border: 1px solid rgba(255,255,255,0.12); color: white; }
    
    /* LIGHT MODE */
    body:not(.dark) { background-color: #f8fafc; color: #0f172a; }
    body:not(.dark) .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    body:not(.dark) .glass-input { background: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; }
    body:not(.dark) th { color: #334155; }
    body:not(.dark) .text-slate-400 { color: #64748b; }
    body:not(.dark) .text-slate-300 { color: #475569; }

    .glass-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    body:not(.dark) ::-webkit-scrollbar-track { background: #e2e8f0; }
    body:not(.dark) ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    .inline-textarea {
      width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; resize: none; overflow: hidden;
    }
    .inline-textarea:focus { background: rgba(59,130,246,0.1); border-color: #3b82f6; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-10">

  <!-- ================= TELA DE LOGIN / CADASTRO COM ABAS ================= -->
  <div id="authScreen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600 rounded-full blur-3xl opacity-20"></div>
      
      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex p-3 bg-blue-600/20 text-blue-500 rounded-xl mb-3 border border-blue-500/30">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Acesso SaaS Seguro</h2>
        <p class="text-sm text-slate-400 mt-1">Seus dados são isolados e criptografados na nuvem.</p>
      </div>

      <!-- SELETOR DE ABAS -->
      <div class="flex gap-2 mb-6 bg-slate-900 p-1 rounded-lg border border-slate-800 relative z-10">
        <button onclick="setAuthMode('login')" id="tabLogin" class="flex-1 py-2 text-xs font-bold rounded-md bg-blue-600 text-white transition-all shadow">Entrar</button>
        <button onclick="setAuthMode('register')" id="tabRegister" class="flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-all">Criar Conta</button>
      </div>

      <form id="authForm" onsubmit="handleAuthAction(event)" class="space-y-4 relative z-10">
        <div id="authError" class="hidden bg-red-500/20 text-red-400 text-xs p-3 rounded-lg border border-red-500/30"></div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail Corporativo</label>
          <input type="email" id="authEmail" required class="w-full glass-input px-4 py-2.5 rounded-xl" placeholder="joao@empresa.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Senha de Acesso</label>
          <input type="password" id="authPassword" required class="w-full glass-input px-4 py-2.5 rounded-xl" placeholder="••••••••">
          <p id="pwdHint" class="hidden text-[10px] text-slate-500 mt-1">Mínimo 6 caracteres, 1 Maiúscula, 1 Número, 1 Símbolo (@!$)</p>
        </div>

        <button type="submit" id="authActionBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-blue-900/50 mt-2">
          Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APLICATIVO PRINCIPAL ================= -->
  <div id="appContainer" class="hidden flex-1 flex-col">
    <!-- TOP HEADER -->
    <header class="glass-panel sticky top-0 z-30 px-4 lg:px-8 py-3">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="p-2.5 bg-blue-600/20 text-blue-500 rounded-xl border border-blue-500/30">
            <i data-lucide="cloud" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
              Gestor Operacional Nuvem
              <span class="text-xs px-2 py-0.5 bg-emerald-500/20 text-emerald-500 border border-emerald-500/30 rounded-full font-normal" id="userEmailDisplay">Logado</span>
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="toggleTheme()" class="p-2 glass-input rounded-xl hover:bg-blue-500/20 transition" title="Alternar Tema">
            <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
          </button>
          <div class="flex items-center gap-2 p-1.5 rounded-xl border glass-input shadow-inner">
            <select id="competenceSelect" onchange="switchCompetence(this.value)" class="bg-transparent font-semibold text-sm px-2 py-1 outline-none cursor-pointer"></select>
            <button onclick="openNewCompetenceModal()" class="bg-blue-600 text-white p-1.5 rounded-lg"><i data-lucide="plus" class="w-4 h-4"></i></button>
            <button onclick="toggleCompetenceLock()" class="bg-amber-600 text-white p-1.5 rounded-lg"><i data-lucide="lock" class="w-4 h-4"></i></button>
            <button onclick="confirmDeleteCompetence()" class="bg-red-600 text-white p-1.5 rounded-lg" title="Apagar Mês"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
          <button onclick="logout()" class="p-2 glass-input text-red-400 hover:bg-red-500/20 rounded-xl transition" title="Sair do Sistema">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-1 w-full space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="relative w-full max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="renderApp()" placeholder="Buscar atividade..." class="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl glass-input">
        </div>
        <button onclick="openAddTaskModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 shadow-lg">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar Tarefa
        </button>
      </div>

      <div class="glass-panel rounded-xl overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="font-semibold uppercase tracking-wider border-b border-slate-700/50">
                <th class="py-3 px-4 w-12">#</th>
                <th class="py-3 px-4 min-w-[200px]">ATIVIDADE</th>
                <th class="py-3 px-4 min-w-[150px]">SITUAÇÃO</th>
                <th class="py-3 px-4 min-w-[180px]">DATA EXECUÇÃO</th>
                <th class="py-3 px-4 min-w-[320px]">ANOTAÇÕES (Auto-Propaga)</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody" class="divide-y divide-slate-700/50 font-medium"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="newCompetenceModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl p-6">
      <h3 class="text-base font-bold mb-4">Nova Competência (Mês)</h3>
      <input type="text" id="newCompetenceId" required placeholder="Ex: 11-12/2026" class="w-full glass-input text-xs px-3 py-2 rounded-xl mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('newCompetenceModal')" class="px-4 py-2 text-xs glass-input rounded-xl">Cancelar</button>
        <button onclick="handleCreateCompetence()" class="px-4 py-2 text-xs text-white bg-blue-600 rounded-xl">Criar</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let appData = { competences: {} };
    let currentCompetenceId = '';
    let authMode = 'login'; // 'login' ou 'register'

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const savedSession = localStorage.getItem('saas_session');
      if(savedSession) {
        currentUser = JSON.parse(savedSession);
        loginSuccess();
      }
    });

    // MUDAR ABAS (ENTRAR / CADASTRAR)
    function setAuthMode(mode) {
      authMode = mode;
      const tabL = document.getElementById('tabLogin');
      const tabR = document.getElementById('tabRegister');
      const btn = document.getElementById('authActionBtn');
      const hint = document.getElementById('pwdHint');
      const err = document.getElementById('authError');
      
      err.classList.add('hidden'); // Limpa erros ao trocar de aba

      if(mode === 'login') {
        tabL.className = "flex-1 py-2 text-xs font-bold rounded-md bg-blue-600 text-white transition-all shadow";
        tabR.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-all";
        btn.textContent = "Entrar no Sistema";
        hint.classList.add('hidden');
      } else {
        tabR.className = "flex-1 py-2 text-xs font-bold rounded-md bg-blue-600 text-white transition-all shadow";
        tabL.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-all";
        btn.textContent = "Finalizar Cadastro";
        hint.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.setAttribute('data-lucide', 'sun');
      } else {
        html.classList.add('dark');
        icon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    function isValidPassword(pwd) {
      const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
      return regex.test(pwd);
    }

    function handleAuthAction(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pwd = document.getElementById('authPassword').value;
      const errorDiv = document.getElementById('authError');
      const userKey = `cloud_db_${email}`;
      let db = localStorage.getItem(userKey);

      if (authMode === 'register') {
        if (!isValidPassword(pwd)) {
          errorDiv.textContent = "Erro: A senha precisa ter mínimo 6 caracteres, 1 Maiúscula, 1 Número e 1 Símbolo especial.";
          errorDiv.classList.remove('hidden');
          return;
        }
        if (db) {
          errorDiv.textContent = "Erro: Este e-mail já está cadastrado. Vá para a aba 'Entrar'.";
          errorDiv.classList.remove('hidden');
          return;
        }
        const novoUser = { email, password: pwd, data: { competences: {} } };
        localStorage.setItem(userKey, JSON.stringify(novoUser));
        currentUser = { email, userKey, pwd };
      } else {
        if (!db) {
          errorDiv.textContent = "Conta não encontrada! Vá para a aba 'Criar Conta' para se cadastrar.";
          errorDiv.classList.remove('hidden');
          return;
        }
        db = JSON.parse(db);
        if (db.password !== pwd) {
          errorDiv.textContent = "Senha incorreta!";
          errorDiv.classList.remove('hidden');
          return;
        }
        currentUser = { email, userKey, pwd };
      }

      errorDiv.classList.add('hidden');
      localStorage.setItem('saas_session', JSON.stringify(currentUser));
      loginSuccess();
    }

    function loginSuccess() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('appContainer').classList.add('flex');
      document.getElementById('userEmailDisplay').textContent = currentUser.email;
      loadCloudData();
    }

    function logout() {
      localStorage.removeItem('saas_session');
      window.location.reload();
    }

    function loadCloudData() {
      const db = JSON.parse(localStorage.getItem(currentUser.userKey));
      appData = db.data;

      if (!appData.competences || Object.keys(appData.competences).length === 0) {
        const initial = '10 ATIVIDADES 09-10';
        appData.competences = {
          [initial]: { id: initial, status: 'OPEN', createdAt: new Date().toISOString(), tasks: [] }
        };
        ['ECONET', 'PROVISÕES', 'SENAI', 'ISBET', 'CIEE'].forEach((name, i) => {
          appData.competences[initial].tasks.push({
            id: String(i), activity: name, status: 'EM ESPERA', execDate: '', notes: ''
          });
        });
        saveCloudData();
      }

      currentCompetenceId = Object.keys(appData.competences)[0];
      renderCompetenceSelector();
      renderApp();
    }

    function saveCloudData() {
      const db = JSON.parse(localStorage.getItem(currentUser.userKey));
      db.data = appData;
      localStorage.setItem(currentUser.userKey, JSON.stringify(db));
    }

    function switchCompetence(val) { currentCompetenceId = val; renderApp(); }

    function renderCompetenceSelector() {
      const sel = document.getElementById('competenceSelect');
      sel.innerHTML = '';
      Object.keys(appData.competences).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = id;
        if(id === currentCompetenceId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function confirmDeleteCompetence() {
      const pwd = prompt("CYBERSEGURANÇA: Para apagar esta competência permanentemente, digite sua senha de login:");
      if (pwd === null) return;
      if (pwd !== currentUser.pwd) { alert("SENHA INCORRETA! Exclusão bloqueada."); return; }
      
      const keys = Object.keys(appData.competences);
      if (keys.length <= 1) { alert("Você precisa ter no mínimo 1 competência."); return; }

      delete appData.competences[currentCompetenceId];
      saveCloudData();
      currentCompetenceId = Object.keys(appData.competences)[0];
      renderCompetenceSelector();
      renderApp();
      alert("Competência apagada com sucesso e segurança!");
    }

    function renderApp() {
      const comp = appData.competences[currentCompetenceId];
      const tbody = document.getElementById('tasksTableBody');
      tbody.innerHTML = '';
      
      comp.tasks.forEach((task, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-3 px-4">${i+1}</td>
          <td class="py-3 px-4 font-bold">${task.activity}</td>
          <td class="py-3 px-4">
            <select onchange="updateTask(this, '${task.id}', 'status')" class="glass-input p-1 rounded">
              <option ${task.status==='CONCLUÍDO'?'selected':''}>CONCLUÍDO</option>
              <option ${task.status==='EM ANDAMENTO'?'selected':''}>EM ANDAMENTO</option>
              <option ${task.status==='EM ESPERA'?'selected':''}>EM ESPERA</option>
            </select>
          </td>
          <td class="py-3 px-4">
            <input type="text" value="${task.execDate}" onchange="updateTask(this, '${task.id}', 'execDate')" class="inline-textarea text-xs" placeholder="Ex: 10/10">
          </td>
          <td class="py-3 px-4">
            <textarea rows="1" onchange="propagateNotes('${task.activity}', this.value)" class="inline-textarea text-xs w-full">${task.notes}</textarea>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateTask(el, id, field) {
      const t = appData.competences[currentCompetenceId].tasks.find(x => x.id === id);
      if(t) { t[field] = el.value; saveCloudData(); }
    }

    function propagateNotes(activityName, newNote) {
      const compTarget = appData.competences[currentCompetenceId];
      const timeOfTarget = new Date(compTarget.createdAt).getTime();

      Object.values(appData.competences).forEach(c => {
        const cTime = new Date(c.createdAt).getTime();
        if (cTime >= timeOfTarget) {
          const t = c.tasks.find(x => x.activity === activityName);
          if (t) t.notes = newNote;
        }
      });
      saveCloudData();
      renderApp();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openNewCompetenceModal() { openModal('newCompetenceModal'); }

    function handleCreateCompetence() {
      const newId = document.getElementById('newCompetenceId').value;
      if(!newId) return;
      
      const clonedTasks = appData.competences[currentCompetenceId].tasks.map(t => ({
        ...t, status: 'EM ESPERA', execDate: ''
      }));

      appData.competences[newId] = {
        id: newId, status: 'OPEN', createdAt: new Date().toISOString(), tasks: clonedTasks
      };
      
      currentCompetenceId = newId;
      saveCloudData();
      closeModal('newCompetenceModal');
      renderCompetenceSelector();
      renderApp();
    }
  </script>
</body>
</html>
